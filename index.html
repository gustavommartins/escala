<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escala</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <button id="btn-settings" class="icon-btn" data-i18n-label="settings.title" aria-haspopup="dialog">⚙︎</button>

    <main id="app">
      <!-- 1. Drop -->
      <section id="view-drop" class="view">
        <div id="dropzone" class="dropzone">
          <div class="dropzone-icon" aria-hidden="true">🎬</div>
          <h1 data-i18n="drop.title"></h1>
          <p class="secondary" data-i18n="drop.or"></p>
          <button id="btn-pick" class="btn btn-primary" data-i18n="drop.pick"></button>
        </div>
        <p id="drop-error" class="error" hidden></p>
      </section>

      <!-- 2. Choose resolution -->
      <section id="view-options" class="view" hidden>
        <div class="card file-card">
          <div class="file-name" id="file-name"></div>
          <div class="secondary" id="file-meta"></div>
        </div>
        <h2 data-i18n="options.convertTo"></h2>
        <div id="options" class="options" role="radiogroup"></div>
        <p class="secondary hint" data-i18n="options.hint"></p>
        <div class="actions">
          <button id="btn-back" class="btn btn-secondary" data-i18n="common.back"></button>
          <button id="btn-convert" class="btn btn-primary" data-i18n="common.convert" disabled></button>
        </div>
      </section>

      <!-- 3. Converting -->
      <section id="view-progress" class="view" hidden>
        <h1 data-i18n="progress.title"></h1>
        <p class="secondary" id="progress-name"></p>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="progress-percent" class="percent">0%</p>
        <div class="actions">
          <button id="btn-cancel" class="btn btn-secondary" data-i18n="common.cancel"></button>
        </div>
      </section>

      <!-- 4. Done -->
      <section id="view-done" class="view" hidden>
        <div class="dropzone-icon" aria-hidden="true">✅</div>
        <h1 data-i18n="done.title"></h1>
        <p class="secondary" id="done-info"></p>
        <div class="actions">
          <button id="btn-another" class="btn btn-secondary" data-i18n="done.another"></button>
          <button id="btn-reveal" class="btn btn-primary" data-i18n="done.reveal"></button>
        </div>
      </section>
    </main>

    <!-- Settings -->
    <div id="settings" class="sheet-backdrop" hidden>
      <div class="sheet card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h1 id="settings-title" data-i18n="settings.title"></h1>
        <label class="field">
          <span data-i18n="settings.language"></span>
          <select id="lang-select"></select>
        </label>
        <div class="actions">
          <button id="btn-settings-close" class="btn btn-primary" data-i18n="settings.close"></button>
        </div>
      </div>
    </div>
  </body>
</html>
