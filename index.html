<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escala</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <button id="btn-settings" class="icon-btn" data-i18n-label="settings.title" aria-haspopup="dialog">⚙︎</button>

    <main id="app">
      <!-- 1. Drop -->
      <section id="view-drop" class="view">
        <div id="dropzone" class="dropzone">
          <div class="dropzone-icon" aria-hidden="true">🎬</div>
          <h1 data-i18n="drop.title"></h1>
          <p class="secondary" data-i18n="drop.or"></p>
          <button id="btn-pick" class="btn btn-primary" data-i18n="drop.pick"></button>
        </div>
        <p id="drop-error" class="error" hidden></p>
      </section>

      <!-- 2. Fila -->
      <section id="view-queue" class="view" hidden>
        <div class="queue-head">
          <h2 data-i18n="options.convertTo"></h2>
          <div id="global-options" class="chips" role="radiogroup"></div>
        </div>
        <div id="queue-list" class="queue-list"></div>
        <p id="queue-error" class="error" hidden></p>
        <div id="overall" class="overall" hidden>
          <div class="overall-row"><span class="secondary" data-i18n="queue.overall"></span><span id="overall-percent" class="secondary"></span></div>
          <div class="progress"><div id="overall-bar" class="progress-bar"></div></div>
        </div>
        <p id="queue-summary" class="secondary summary" hidden></p>
        <div class="actions">
          <button id="btn-add" class="btn btn-secondary" data-i18n="queue.add"></button>
          <button id="btn-convert-all" class="btn btn-primary" data-i18n="queue.convertAll" disabled></button>
          <button id="btn-cancel-all" class="btn btn-secondary" data-i18n="queue.cancelAll" hidden></button>
        </div>
      </section>
    </main>

    <footer id="app-footer">
      <span id="footer-version" class="secondary"></span>
      <span id="update-status" class="secondary" hidden></span>
      <button id="btn-update" class="link-btn" hidden></button>
    </footer>

    <!-- Settings -->
    <div id="settings" class="sheet-backdrop" hidden>
      <div class="sheet card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h1 id="settings-title" data-i18n="settings.title"></h1>
        <label class="field">
          <span data-i18n="settings.language"></span>
          <select id="lang-select"></select>
        </label>
        <label class="field">
          <span data-i18n="settings.parallel"></span>
          <select id="parallel-select"></select>
        </label>
        <label class="check">
          <input type="checkbox" id="hwaccel-check" />
          <span data-i18n="settings.hwaccel"></span>
        </label>
        <div class="actions">
          <button id="btn-settings-close" class="btn btn-primary" data-i18n="settings.close"></button>
        </div>
      </div>
    </div>
  </body>
</html>
