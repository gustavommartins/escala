<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escala</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main id="app">
      <!-- 1. Soltar -->
      <section id="view-drop" class="view">
        <div id="dropzone" class="dropzone">
          <div class="dropzone-icon" aria-hidden="true">🎬</div>
          <h1>Arraste seu vídeo aqui</h1>
          <p class="secondary">ou</p>
          <button id="btn-pick" class="btn btn-primary">Escolher arquivo…</button>
        </div>
        <p id="drop-error" class="error" hidden></p>
      </section>

      <!-- 2. Escolher resolução -->
      <section id="view-options" class="view" hidden>
        <div class="card file-card">
          <div class="file-name" id="file-name"></div>
          <div class="secondary" id="file-meta"></div>
        </div>
        <h2>Converter para</h2>
        <div id="options" class="options" role="radiogroup"></div>
        <p class="secondary hint">
          A qualidade é preservada: o app usa configurações que mantêm a imagem visualmente idêntica.
        </p>
        <div class="actions">
          <button id="btn-back" class="btn btn-secondary">Voltar</button>
          <button id="btn-convert" class="btn btn-primary" disabled>Converter</button>
        </div>
      </section>

      <!-- 3. Convertendo -->
      <section id="view-progress" class="view" hidden>
        <h1 id="progress-title">Convertendo…</h1>
        <p class="secondary" id="progress-name"></p>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="progress-percent" class="percent">0%</p>
        <div class="actions">
          <button id="btn-cancel" class="btn btn-secondary">Cancelar</button>
        </div>
      </section>

      <!-- 4. Pronto -->
      <section id="view-done" class="view" hidden>
        <div class="dropzone-icon" aria-hidden="true">✅</div>
        <h1>Pronto!</h1>
        <p class="secondary" id="done-info"></p>
        <div class="actions">
          <button id="btn-another" class="btn btn-secondary">Converter outro</button>
          <button id="btn-reveal" class="btn btn-primary">Mostrar na pasta</button>
        </div>
      </section>
    </main>
  </body>
</html>
